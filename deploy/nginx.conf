worker_processes 1;
daemon off;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
    access_log /dev/stdout;
    sendfile on;
    client_max_body_size 25M;

    # Streamlit needs proxy_buffering off + websocket upgrade for live reruns
    proxy_buffering off;
    proxy_read_timeout 86400;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 7860 default_server;
        server_name _;
        # Behind the HF proxy: keep redirects relative (no http://…:7860 in Location)
        absolute_redirect off;

        # FastAPI on :8000 — webhook + health + debug endpoints
        location /webhook/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /debug/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }
        location = /health {
            proxy_pass http://127.0.0.1:8000/health;
            proxy_set_header Host $host;
        }
        # Case API — the offline /lite page syncs queued cases here
        location /api/ {
            client_max_body_size 3M;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Offline-first PWA (static files; the service worker must never be cached stale)
        location = /lite {
            return 301 /lite/;
        }
        location = /lite/sw.js {
            alias /app/lite/sw.js;
            default_type application/javascript;
            add_header Cache-Control "no-cache";
            add_header Service-Worker-Allowed "/lite/";
        }
        location /lite/ {
            alias /app/lite/;
            index index.html;
            include /etc/nginx/mime.types;
            add_header Cache-Control "no-cache";
        }

        location = /bot-status {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
        }

        # Everything else → Streamlit on :8501 (with websocket upgrade)
        location / {
            proxy_pass http://127.0.0.1:8501;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
